<!--
  Site-wide 404 page for ashiqur.in apps.
  Fully independent - no dependency on /style.css, /script.js,
  apps.data.js, or featured.app.details.js. All CSS is inlined below
  and the avatar mark SVG is embedded directly in the markup, so this
  page renders correctly (chrome, styling, avatar, links) even if
  every other file on the site is broken, renamed, mid-deploy, or
  unreachable - which is exactly the situation a 404 page needs to
  survive. Google Fonts is the one external request kept, purely
  cosmetic: if it fails to load, the font-family fallbacks
  (sans-serif / monospace) keep the page fully legible.

  Every link/href/asset URL below is a full, absolute URL
  (https://apps.ashiqur.in/...), matching the convention
  SITE_CONFIG normally uses for homeUrl/appsUrl/nav/footer/assets.
  This matters here specifically: most static hosts (GitHub Pages,
  Netlify, Vercel, Cloudflare Pages, etc.) serve this exact file for
  ANY unmatched URL at ANY depth (e.g. /apps/some-typo/here), and a
  relative or root-relative path would resolve against that broken
  URL rather than this file's real location. A fully-qualified URL
  always resolves correctly, no matter what URL triggered the 404.

  Header brand mark: this page loads the real
  https://apps.ashiqur.in/assets/logo.png (same absolute path
  SITE_CONFIG.assets.logo points at) directly via an <img>, layered
  over the embedded pixel-mark SVG. No JS is needed for the
  fallback - the <img>'s own onerror removes it if logo.png is
  missing or unreachable, revealing the SVG underneath - so, same
  as everything else on this page, there's no scenario where
  branding is just broken.

  Design values (colors, spacing, type) are copied from the shared
  /style.css so this still looks identical to the rest of the site -
  just without depending on that file loading. If the site's design
  system changes, update both places.
-->

<style>
:root{
  --paper: #F4F5F0;
  --paper-raised: #FFFFFF;
  --ink: #14161A;
  --ink-soft: #55585F;
  --accent: #2F6FED;
  --line: #DBDDD6;
  --radius: 14px;
  --wrap: 1080px;
}
@media (prefers-color-scheme: dark){
  :root{
    --paper: #14161A;
    --paper-raised: #1B1E24;
    --ink: #F4F5F0;
    --ink-soft: #A6A9B1;
    --line: #2B2E36;
  }
}
*{ box-sizing:border-box; }
html{ scroll-behavior:smooth; }
@media (prefers-reduced-motion: reduce){ html{ scroll-behavior:auto; } }
body{
  margin:0; background:var(--paper); color:var(--ink);
  font-family:'Space Grotesk', sans-serif; line-height:1.5;
  -webkit-font-smoothing:antialiased; overflow-x:hidden;
}
.wrap{ max-width:var(--wrap); margin:0 auto; padding:0 24px; }
a{ color:inherit; }
:focus-visible{ outline:2.5px solid var(--accent); outline-offset:3px; border-radius:4px; }
h1{ font-family:'Space Mono', monospace; font-weight:700; margin:0; letter-spacing:-0.01em; font-size:clamp(34px, 5vw, 54px); line-height:1.04; }
.eyebrow-text{ font-family:'Space Mono', monospace; text-transform:uppercase; letter-spacing:0.08em; font-size:12px; color:var(--accent); }

/* ---------- Header ---------- */
.site-header{ border-bottom:1px solid var(--line); }
.header-inner{ display:flex; align-items:center; justify-content:space-between; padding:20px 24px; }
.brand{ display:flex; align-items:center; gap:10px; text-decoration:none; }
.brand-mark{ width:32px; height:32px; flex-shrink:0; color:var(--ink); position:relative; }
.brand-mark svg{ display:block; width:100%; height:100%; }
.brand-mark img{ position:absolute; inset:0; width:100%; height:100%; object-fit:contain; display:block; }
.brand-text{ font-family:'Space Mono', monospace; text-transform:uppercase; letter-spacing:0.08em; font-size:13px; font-weight:700; }
.header-nav{ display:flex; gap:22px; }
.header-nav a{
  font-size:14px; text-decoration:none; color:var(--ink-soft);
  border-bottom:1px solid transparent; padding-bottom:2px;
  transition:color .15s ease, border-color .15s ease;
}
.header-nav a:hover{ color:var(--ink); border-color:var(--ink); }

/* ---------- Hero (centered variant, same as the homepage's) ---------- */
.hero{
  display:grid; grid-template-columns:1fr; gap:56px; align-items:center;
  padding:64px 24px 56px; text-align:center; justify-items:center;
}
.eyebrow-row{ display:flex; align-items:center; justify-content:center; flex-wrap:wrap; gap:8px; margin:0 0 18px; }
.lede{ margin:22px auto 0; max-width:46ch; color:var(--ink-soft); font-size:17px; }
.cta-row{ display:flex; align-items:center; justify-content:center; gap:16px; margin-top:32px; flex-wrap:wrap; }
.btn-primary{
  display:inline-flex; align-items:center; gap:8px;
  font-family:'Space Grotesk', sans-serif; font-weight:700; font-size:15.5px;
  background:var(--ink); color:var(--paper); border:none; border-radius:999px;
  padding:15px 28px; cursor:pointer; text-decoration:none;
  transition:transform .15s ease, background .15s ease;
}
.btn-primary:hover{ background:var(--accent); transform:translateY(-1px); }
.btn-primary:active{ transform:translateY(0); }
.btn-secondary{
  display:inline-flex; align-items:center; gap:8px;
  font-family:'Space Grotesk', sans-serif; font-weight:700; font-size:14.5px;
  background:transparent; color:var(--ink); border:1px solid var(--line); border-radius:999px;
  padding:13px 24px; cursor:pointer; text-decoration:none;
  transition:border-color .15s ease, background .15s ease;
}
.btn-secondary:hover{ border-color:var(--ink); background:rgba(20,22,26,0.04); }
@media (prefers-color-scheme: dark){ .btn-secondary:hover{ background:rgba(244,245,240,0.06); } }
.hero-visual{ display:flex; justify-content:center; }
.mark-grid{
  width:min(300px, 70vw); aspect-ratio:1/1; display:flex; align-items:center; justify-content:center;
  background:transparent;
}
.mark-grid svg{ display:block; width:100%; height:100%; object-fit:cover; }

/* ---------- Footer ---------- */
.site-footer{
  display:flex; flex-direction:column; align-items:center; text-align:center; gap:8px;
  padding:26px 24px 40px; font-size:12.5px; color:var(--ink-soft);
  position:relative;
}
.site-footer::before{
  content:""; position:absolute; top:0; left:50%; transform:translateX(-50%);
  width:100vw; border-top:1px solid var(--line);
}
.footer-top{ display:flex; align-items:center; justify-content:center; flex-wrap:wrap; gap:10px; }
.footer-top a{ text-decoration:underline; text-underline-offset:3px; color:var(--ink-soft); }
.footer-top a:hover{ color:var(--ink); }
.footer-dot{ width:5px; height:5px; border-radius:50%; background:var(--ink-soft); flex-shrink:0; }
.footer-updated{ margin:0; font-size:11px; color:var(--ink-soft); opacity:.7; }
</style>
